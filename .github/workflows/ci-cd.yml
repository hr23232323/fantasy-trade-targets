name: Deploy to Cloud Run

on:
  push:
    branches:
      - main
  schedule:
    - cron: "17 5,13,21 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    name: Test and deploy Next.js app to Cloud Run
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - id: auth
      uses: google-github-actions/auth@v2
      with:
        credentials_json: '${{ secrets.GCLOUD_AUTH_SA_KEY }}'

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2
      with:
        project_id: fantasy-trade-targets

    - name: Configure Docker to use gcloud as a credential helper
      run: gcloud auth configure-docker

    - name: Use Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: frontend/package-lock.json

    - id: market_refresh
      name: Refresh and archive public market data
      working-directory: frontend
      continue-on-error: true
      env:
        TRADYR_API_KEY: ${{ secrets.TRADYR_API_KEY }}
      run: npm run data:refresh

    - id: team_refresh
      name: Refresh NFL team and schedule data
      working-directory: frontend
      continue-on-error: true
      run: npm run data:teams

    - name: Test frontend
      working-directory: frontend
      run: |
        npm ci
        npm run test
        npm run typecheck
        npm run build

    - name: Deploy Frontend
      shell: bash
      run: |
        set -x
        make deploy-gha

    - name: Notify IndexNow
      continue-on-error: true
      working-directory: frontend
      run: npm run indexnow:submit

    - name: Commit the published release and snapshot
      if: steps.market_refresh.outcome == 'success' || steps.team_refresh.outcome == 'success'
      run: |
        git config user.name "Fantasy Trade Target Data"
        git config user.email "data@fantasytradetarget.com"
        git add frontend/data/public-release.json frontend/data/team-release.json data/player-snapshot-history.json data/snapshots
        git diff --cached --quiet || git commit -m "data: publish ${GITHUB_RUN_ID}"
        git push

    - name: Report scheduled refresh failures
      if: always() && github.event_name != 'push' && (steps.market_refresh.outcome != 'success' || steps.team_refresh.outcome != 'success')
      run: |
        echo "One or more scheduled data refreshes failed; validated releases were preserved."
        exit 1
